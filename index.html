<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Free World 2D</title>
  </head>
  <body>
    <div id="app">
      <canvas id="sim"></canvas>
      <div id="toolbar">
        <button id="tool-select" class="tool-btn active" data-tool="select" title="Select / move / lock">
          Select
        </button>
        <button id="tool-draw" class="tool-btn" data-tool="draw" title="Draw a track or line">Draw</button>
        <button id="tool-ball" class="tool-btn" data-tool="ball" title="Place a ball">Ball</button>
        <button id="tool-box" class="tool-btn" data-tool="box" title="Place a box">Box</button>
        <div class="toolbar-divider"></div>
        <button id="play-btn" class="tool-btn accent">Play</button>
        <button id="clear-btn" class="tool-btn danger">Clear</button>
        <div class="toolbar-divider"></div>
        <button id="export-btn" class="tool-btn" title="Download this scene as a JSON file">Export</button>
        <button id="import-btn" class="tool-btn" title="Load a previously exported scene">Import</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden />
      </div>
      <div id="hint">
        Right-click an object to lock/unlock it &middot; select a ball and drag its blue handle to set spin
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
